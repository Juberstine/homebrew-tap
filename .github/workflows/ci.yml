name: Homebrew

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    name: Formula (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add local tap
        run: brew tap Juberstine/tap "$GITHUB_WORKSPACE"
      - name: Audit formula
        run: brew audit --strict Juberstine/tap/codex-deepseek-switcher
      - name: Install and test formula
        run: |
          brew install Juberstine/tap/codex-deepseek-switcher
          brew test Juberstine/tap/codex-deepseek-switcher
